<!DOCTYPE html>
<html>
<head>
    <title>Test Design</title>
</head>
<body>
    <section class="hero-section">
        <div class="container" style="display: flex; flex-direction: column; gap: 24px; padding: 48px;">
            <h1 style="font-size: 48px; font-weight: 600; color: #0A192F; margin-bottom: 16px;">Welcome to Our Platform</h1>
            <p style="font-size: 18px; color: #112240; max-width: 600px;">Experience the future of design with our innovative solutions.</p>
            <div style="display: flex; gap: 16px; margin-top: 32px;">
                <a href="#" class="btn-primary" style="background-color: #0A192F; color: white; padding: 16px 32px; border-radius: 16px; text-decoration: none;">Get Started</a>
                <a href="#" class="btn-secondary" style="border: 2px solid #0A192F; color: #0A192F; padding: 16px 32px; border-radius: 16px; text-decoration: none;">Learn More</a>
            </div>
        </div>
    </section>
    <section class="features-section" style="padding: 64px 0;">
        <div class="container" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px;">
            <div class="feature-card" style="background-color: #f8f9fa; padding: 32px; border-radius: 16px; box-shadow: 0 20px 40px rgba(10, 25, 47, 0.05);">
                <h3 style="font-size: 24px; font-weight: 600; color: #0A192F; margin-bottom: 12px;">Fast Performance</h3>
                <p style="color: #112240; line-height: 1.6;">Optimized for speed and efficiency.</p>
            </div>
            <div class="feature-card" style="background-color: #f8f9fa; padding: 32px; border-radius: 16px; box-shadow: 0 20px 40px rgba(10, 25, 47, 0.05);">
                <h3 style="font-size: 24px; font-weight: 600; color: #0A192F; margin-bottom: 12px;">Secure by Default</h3>
                <p style="color: #112240; line-height: 1.6;">Enterprise-grade security built-in.</p>
            </div>
            <div class="feature-card" style="background-color: #f8f9fa; padding: 32px; border-radius: 16px; box-shadow: 0 20px 40px rgba(10, 25, 47, 0.05);">
                <h3 style="font-size: 24px; font-weight: 600; color: #0A192F; margin-bottom: 12px;">Easy Integration</h3>
                <p style="color: #112240; line-height: 1.6;">Seamlessly connects with your tools.</p>
            </div>
        </div>
    </section>
</body>
</html>
